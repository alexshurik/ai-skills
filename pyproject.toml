[project]
name = "sk-skills"
version = "0.1.0"
description = "Cross-host agent skills and durable workflow runtime"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.10,<8",
    "jsonschema>=4.25,<5",
    "mypy>=1.19,<2",
    "ruff>=0.14,<1",
    "types-jsonschema>=4.26,<5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "evals/validate-result.py",
    "scripts/**/*.py",
    "shared/review-evidence/**/*.py",
    "tests/**/*.py",
    "workflow/agents/shared/runtime-state/**/*.py",
]

[tool.ruff.lint]
select = ["B", "C4", "C90", "E", "F", "I", "PERF", "PIE", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["E501", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
files = [
    "evals/validate-result.py",
    "scripts",
    "shared/review-evidence",
    "tests",
    "workflow/agents/shared/runtime-state/_sk_runtime",
    "workflow/agents/shared/runtime-state/sk_state.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["workflow/agents/shared/runtime-state/_sk_runtime"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
